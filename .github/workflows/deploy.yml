name: App PWA CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-check:
    name: Build and Check Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Testar Exportação Web Estática (PWA)
        env:
          EXPO_PUBLIC_API_BASE_URL: ""
          EXPO_PUBLIC_ENABLE_DEV_MENU: "false"
        run: npx expo export --platform web

  build-and-push:
    name: Build and Push Docker Image
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker PWA
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            EXPO_PUBLIC_API_BASE_URL=
            EXPO_PUBLIC_ENABLE_DEV_MENU=false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pohinc-app:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Criar diretório de deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          script: |
            mkdir -p ~/deploy-app

      - name: Copiar docker-compose.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          source: "docker-compose.yml"
          target: "~/deploy-app"

      - name: Executar Deploy na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          script: |
            cd ~/deploy-app

            # 1. Configura variáveis de ambiente locais da VPS
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            APP_PORT=${{ secrets.APP_PORT != '' && secrets.APP_PORT || '8081' }}
            EOF

            # 2. Autentica no Docker Hub se as credenciais estiverem preenchidas (necessário para imagens privadas)
            if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            fi

            # 3. Puxa a imagem atualizada
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pohinc-app:latest

            # 4. Sobe o container detectando 'docker compose' (v2 plugin) ou 'docker-compose' (v1/standalone)
            if docker compose version >/dev/null 2>&1; then
              echo "Utilizando: docker compose (v2)"
              docker compose up -d --remove-orphans
            elif command -v docker-compose >/dev/null 2>&1; then
              echo "Utilizando: docker-compose (standalone)"
              docker-compose up -d --remove-orphans
            else
              echo "ERRO: Nem 'docker compose' nem 'docker-compose' foram encontrados na VPS!"
              exit 1
            fi

            # 5. Exibe status do container em execução
            sleep 3
            docker ps --filter "name=pohinc_app_web"

            # 6. Limpa imagens antigas não utilizadas
            docker image prune -f


